{{- if and .Values.credentials.create (not .Values.credentials.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-credentials
  labels:
    {{- include "proxlb.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.credentials }}
  {{- if .user }}
  {{ .keys.user }}: {{ .user | quote }}
  {{- end }}
  {{- if .tokenId }}
  {{ .keys.tokenId }}: {{ .tokenId | quote }}
  {{- end }}
  {{- if .tokenSecret }}
  {{ .keys.tokenSecret }}: {{ .tokenSecret | quote }}
  {{- end }}
  {{- if .password }}
  {{ .keys.password }}: {{ .password | quote }}
  {{- end }}
  {{- end }}
{{- end }}
