proxmox_api:
  hosts: ['virt01.example.com', '10.10.10.10', 'fe01:bad:code::cafe']
  user: root@pam
  pass: crazyPassw0rd!
  # API Token method
  # token_id: proxlb
  # token_secret: 430e308f-1337-1337-beef-1337beefcafe
  ssl_verification: True
  timeout: 10
  # API Connection retries
  # retries: 1
  # wait_time: 1
  parallel_requests: 8                # Concurrent API requests while collecting metrics (1 = sequential)

proxmox_cluster:
  maintenance_nodes: ['virt66.example.com']
  maintenance_nodes_schedule:
    duration: 3                       # Duration in hours after the configured schedule start
    pre-migration: 10                 # Start maintenance this many minutes before the configured schedule
    schedules:
      virt77.example.com:
        - 'Monday, 8:00'
  ignore_nodes: []
  overprovisioning: True

balancing:
  enable: True
  enforce_affinity: False
  enforce_pinning: False
  parallel: False
  # If running parallel job, you can define
  # the amount of prallel jobs (default: 5)
  parallel_jobs: 1
  live: True
  with_local_disks: True
  with_conntrack_state: True
  # Target storage remapping for node-local (non-shared) storage clusters, where
  # the source storage id may not exist on the target node. Disabled by default.
  target_storage_auto: False          # Auto-pick the target-node storage with the most free space
  # target_storage_map:               # Optional: pin a storage per target node (overrides auto)
  #   pve5: local
  #   pve2: local
  target_storage_capacity_guard: True # Skip a migration when the target storage cannot hold the
                                      # guest's disk plus the margin below (accounts for in-flight
                                      # migrations). Prevents disk-full / IO errors from overcommit.
  target_storage_min_free_percent: 10.0  # Safety margin to keep free, as % of the storage's total size
  target_storage_min_free_gib: 0      # Absolute safety margin floor in GiB (effective margin = max of both)
  cpu_overcommit: 2.0                 # Maximum ratio of vCPUs to physical cores per node
  max_node_inflow: 1                  # Maximum number of VMs that may be migrated onto any single node per run
  # max_migrations_per_run: 4         # Optional: cap of migrations planned per run (the rest waits for the next run)
  # memory_target_max_percent: 93     # Optional: target node RAM ceiling after a move (swap / KSM headroom)
  balance_types: ['vm', 'ct']         # 'vm' | 'ct'
  max_job_validation: 1800            # Maximum time (in seconds) a job validation may take
  memory_threshold: 75                # Optional: Maximum threshold (in percent) to trigger balancing actions
  cpu_threshold: 75                   # Optional: Maximum threshold (in percent) to trigger balancing actions
  balanciness: 5                      # Maximum delta of resource usage between highest and lowest usage node
  method: memory                      # greedy: 'memory' | 'cpu' | 'disk'
                                      # solver only (solver.enable: True):
                                      #   'global_smart' (memory+cpu+disk combined),
                                      #   'memory_smart'|'cpu_smart'|'io_smart' (usage+PSI),
                                      #   'memory_psi'|'cpu_psi'|'io_psi' (pressure only)
  mode: used                          # 'assigned' | 'used' | 'psi'
  balance_larger_guests_first: False  # Option to prioritize balancing of larger or smaller guests first
  # ignore_guests: ['my-auto-vm-01', 'my-auto-vm-02']  # Optional: Ignore guests by name instead of using plb_ignore_* tags
  ignore_zfs_arc: False               # Optional: Do not count the ZFS ARC as used memory of a node (requires PVE >= 9)
  node_resource_reserve:              # Optional: Define resource reservations for nodes (in GB)
    defaults:                         # Default reservation values applying to all nodes (unless explicitly overridden)
      memory: 4                       # Default: 4 GB memory reserved per node
    node01:                           # Specific node reservation override for node 'node01'
      memory: 6                       # Specific: 6 GB memory reserved for node 'node01'
  # # PSI thresholds only apply when using mode 'psi'
  # psi:
  #   nodes:
  #     memory:
  #       pressure_full: 0.20
  #       pressure_some: 0.20
  #       pressure_spikes: 1.00
  #     cpu:
  #       pressure_full: 0.20
  #       pressure_some: 0.20
  #       pressure_spikes: 1.00
  #     disk:
  #       pressure_full: 0.20
  #       pressure_some: 0.20
  #       pressure_spikes: 1.00
  #   guests:
  #     memory:
  #       pressure_full: 0.20
  #       pressure_some: 0.20
  #       pressure_spikes: 1.00
  #     cpu:
  #       pressure_full: 0.20
  #       pressure_some: 0.20
  #       pressure_spikes: 1.00
  #     disk:
  #       pressure_full: 0.20
  #       pressure_some: 0.20
  #       pressure_spikes: 1.00
  pools:                              # Optional: Define affinity/anti-affinity rules per pool
    dev:                              # Pool name: dev
      type: affinity                  # Type: affinity (keeping VMs together)
    de-nbg01-db:                      # Pool name: de-nbg01-db
      type: anti-affinity             # Type: anti-affinity (spreading VMs apart)
      pin:                            # Define a pinning og guests to specific node(s)
        - virt66
        - virt77
      strict: False                   # Disable strict mode of node pinning for this pool

# Storage aware balancing: detect full / soon full storages and fix them.
# Escalation: 1) fstrim via guest agent (discard=on disks) 2) live disk move to
# another storage of the same node 3) migrate the guest to another node.
storage_balancing:
  enable: True
  warning_percent: 80                 # Report storages above this fill level
  critical_percent: 90                # Act on storages above this fill level
  target_max_percent: 75              # Aim for this level; never fill a destination above it
  # Optional thresholds in free GiB (the smaller free space of % and GiB applies):
  # warning_free_gib: 200
  # critical_free_gib: 100
  # target_free_gib: 300
  forecast: True                      # Also act on storages forecast to hit critical_percent...
  forecast_days: 7                    # ...within this many days
  forecast_min_percent: 70            # ...but only once a storage is at least this full
  forecast_timeframe: week            # RRD history used for the trend: hour | day | week | month | year
  strategy: disk_move_first           # disk_move_first | migrate_first
  allow_disk_move: True               # VMs only (Proxmox can't move volumes of running CTs)
  allow_node_migration: True          # Honors balancing.balance_types, pinning and (anti-)affinity
  fstrim: True                        # Run fstrim in the guest first (needs agent + discard=on)
  delete_source: True                 # Delete the source volume after a successful disk move
  max_actions_per_run: 5
  parallel_moves: 1
  # bwlimit: 102400                   # Optional disk move bandwidth limit in KiB/s
  exclude_storages: []

# Automatic recovery of VMs paused by an I/O error (e.g. full thin pool).
# Space is freed first; a VM is only resumed once its storages have room again.
io_error_recovery:
  enable: True
  interval: 60                        # Watchdog interval (seconds) between balancing runs
  resume_paused: False                # Also resume VMs in plain 'paused' state
  min_free_percent: 2                 # Don't resume while a VM storage has less free space...
  min_free_gib: 1                     # ...than max(min_free_percent, min_free_gib)
  max_resume_attempts: 3              # Per VM and per hour, then give up and alert
  emergency_min_interval: 120         # Min. seconds between two immediate runs for a full storage
  emergency_max_interval: 1800        # Back-off ceiling while those runs cannot free anything

service:
  daemon: True
  # Internal control endpoint for the YorkHost ops panel (status, run now,
  # config validation). Token: PROXLB_CONTROL_TOKEN (env or PROXLB_ENV_FILE).
  control:
    enable: False
    bind: 0.0.0.0
    port: 8080
  enable_ha: True                     # Run ProxLB in HA mode using shared state in Proxmox cluster (requires Proxmox VE 8.4+)
  schedule:
    interval: 12
    format: hours
  delay:
    enable: False
    time: 1
    format: hours
  log_level: INFO

# Optional: CP-SAT solver integration (requires proxlb-solver package)
# Install with: pip install proxlb-solver
# See docs/04_solver.md for full documentation.
# solver:
#   enable: False                   # Set to True to activate the solver
#   mode: shadow                    # 'shadow' (observe only) | 'active' (solver drives migrations)
#   log_dir: /var/log/proxlb/solver # Directory for JSONL run logs and HTML reports
#   timeout_seconds: 30             # CP-SAT wall-clock time limit per solve (seconds)
#   use_reservations: True          # Apply node_resource_reserve entries as hard constraints
#   active_step_retries: 3          # Max re-solve attempts on migration failure (active mode only)
#   fallback_to_greedy: True        # Fall back to greedy Balancing() when the solver cannot place VMs (active mode only)
#   method: cpu_smart               # Optional: solver-only balancing method, overrides balancing.method for the solver
#                                   # memory|cpu|disk|memory_psi|cpu_psi|io_psi|memory_smart|cpu_smart|io_smart|global_smart
#                                   # Requires proxlb-solver > 0.1.1; older releases ignore it.
