name: Helm chart lint
on:
  push:
    paths: [ 'helm/**', '.github/workflows/15-helm-lint.yml' ]
  pull_request:
    paths: [ 'helm/**' ]
jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint helm/proxlb
      - name: Render with defaults
        run: helm template proxlb helm/proxlb
      - name: Render with created secret and extras
        run: |
          helm template proxlb helm/proxlb \
            --set credentials.create=true \
            --set credentials.user=proxlb@pve \
            --set credentials.tokenId=proxlb \
            --set credentials.tokenSecret=dummy \
            --set 'image.imagePullSecrets[0].name=ghcr-pull' \
            --set 'extraEnv[0].name=REQUESTS_CA_BUNDLE' \
            --set 'extraEnv[0].value=/etc/proxlb/ca/ca.crt' \
            --set extraArgs.dryRun=true
      - name: Render with existing secret and configmap
        run: |
          helm template proxlb helm/proxlb \
            --set credentials.existingSecret=proxlb-api \
            --set configmap.create=false \
            --set configmap.existingConfigMap=proxlb-config
